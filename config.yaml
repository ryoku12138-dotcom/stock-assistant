# ==================== Stock Assistant Config ====================
# Phase 1: Self-selected stock monitoring

# ---- Feishu ----
feishu:
  webhook_url: "${FEISHU_WEBHOOK_URL}"  # Set via env var or GitHub Secrets

# ---- AKShare ----
akshare:
  retry_count: 3
  retry_delay: 2  # seconds between retries

# ---- DeepSeek V3 ----
deepseek:
  api_key: "${DEEPSEEK_API_KEY}"  # Set via env var or GitHub Secrets
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  max_tokens: 2048
  temperature: 0.3

# ---- Technical Indicators ----
indicators:
  ma_periods: [5, 10, 20]
  macd:
    fast: 12
    slow: 26
    signal: 9
  rsi:
    period: 14
  kdj:
    k_period: 9
    d_period: 3
    j_period: 3
  bollinger:
    period: 20
    std_dev: 2

# ---- Watchlist (self-selected stocks) ----
# Format: code: name (name is used in notifications, no API call needed)
watchlist:
  - code: "603739"
    name: "蔚蓝生物"
  - code: "603598"
    name: "引力传媒"
  - code: "600151"
    name: "航天机电"
  - code: "603978"
    name: "深圳新星"
  - code: "600879"
    name: "航天电子"
  - code: "002348"
    name: "高乐股份"

# ---- Schedule ----
schedule:
  run_time: "15:00"  # daily run time (market close)
