name: Stock Assistant Scheduled Analysis

on:
  schedule:
    # 交易日 09:00 北京时间 = 01:00 UTC
    - cron: "0 1 * * 1-5"
    # 交易日 16:30 北京时间 = 08:30 UTC
    - cron: "30 8 * * 1-5"
    # 周五 17:00 北京时间 = 09:00 UTC
    - cron: "0 9 * * 5"

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        type: choice
        options:
          - morning
          - daily
          - weekly

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR_UTC=$(date -u +%H)
            MINUTE_UTC=$(date -u +%M)
            DAY_OF_WEEK=$(date -u +%u)
            echo "UTC: ${HOUR_UTC}:${MINUTE_UTC}, Day: ${DAY_OF_WEEK}"
            # Priority: weekly (Fri 09:00+) > morning (01:00) > daily (08:00-09:14) > fallback daily
            if [ "$HOUR_UTC" = "09" ] && [ "$DAY_OF_WEEK" = "5" ]; then
              echo "mode=weekly" >> $GITHUB_OUTPUT
            elif [ "$HOUR_UTC" = "01" ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR_UTC" = "08" ] || ([ "$HOUR_UTC" = "09" ] && [ "${MINUTE_UTC#0}" -lt "15" ]); then
              echo "mode=daily" >> $GITHUB_OUTPUT
            else
              echo "mode=daily" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Selected mode: $(cat $GITHUB_OUTPUT)"

      - name: Run Stock Assistant
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TZ: Asia/Shanghai
        run: python main.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit and push logs
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@stock-assistant.local"
          git add logs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "auto: update signal logs [skip ci]"
            git push origin main
          fi
